<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Partida Dux</title>
  <style>
    :root{color-scheme:dark;--bg:#09151c;--panel:#122831;--line:#2b4854;--mint:#93e6ce;--text:#eef7f8;--muted:#afc2c8;--pink:#ff9aae}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 20px}
    header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}a{color:var(--mint)}.badge{color:var(--mint);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{margin:.2rem 0 1rem}
    .screen{height:min(55vw,480px);min-height:250px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(#7f9ca5 0 46%,#59635d 46% 67%,#293b34 67%);box-shadow:0 20px 70px #0007}
    .wall{position:absolute;inset:8% 13% 18%;background-color:#435d66;background-image:linear-gradient(90deg,#23343b 1px,transparent 1px),linear-gradient(#23343b 1px,transparent 1px);background-size:64px 64px;transform:perspective(500px) rotateX(3deg);box-shadow:inset 0 0 70px #07101699}
    .poster{position:absolute;width:min(22%,170px);aspect-ratio:1;left:50%;top:26%;transform:translateX(-50%);image-rendering:pixelated;border:5px solid #18282d;box-shadow:0 12px 28px #0009}
    .crosshair{position:absolute;left:50%;top:55%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.85}.crosshair:before,.crosshair:after{content:'';position:absolute;background:#eaf2ed;box-shadow:0 1px 2px #000}.crosshair:before{width:2px;height:18px;left:8px}.crosshair:after{height:2px;width:18px;top:8px}
    .hud{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;background:#061018bb;color:#c4d8dc;font:13px ui-monospace,monospace;display:flex;justify-content:space-between}
    .game{display:none;height:min(65vw,680px);min-height:360px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#000;box-shadow:0 20px 70px #0007}.game iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .game-controls{display:none;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:12px 0 18px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:#10232b}
    .control-set{display:flex;align-items:center;gap:12px}.control-label{display:block;color:var(--muted);font-size:.77rem;text-transform:uppercase;letter-spacing:.08em;font-weight:750}
    .keys{display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(2,32px);gap:4px}.key{display:grid;place-items:center;border:1px solid #54717b;border-bottom-width:3px;border-radius:7px;background:#1d3842;color:var(--text);font:700 .82rem ui-monospace,monospace}.key.w{grid-column:2}.key.a{grid-column:1;grid-row:2}.key.s{grid-column:2;grid-row:2}.key.d{grid-column:3;grid-row:2}
    .mouse-icon{width:38px;height:48px;flex:none}.mouse-icon path,.mouse-icon line{stroke:var(--mint);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.mouse-icon .wheel{stroke-width:3}
    button{font:inherit;cursor:pointer}.fullscreen{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:9px 15px;border:1px solid #54717b;border-radius:999px;background:#1d3842;color:var(--text);font-weight:700}.fullscreen:hover{background:#294a55}.fullscreen:focus-visible{outline:3px solid #fff;outline-offset:3px}.fullscreen svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .game:fullscreen{width:100vw;height:100vh;max-width:none;min-height:0;border:0;border-radius:0;box-shadow:none}.game:fullscreen iframe{width:100vw;height:100vh}
    .game.expanded{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;max-width:none;min-height:0;border:0;border-radius:0;box-shadow:none;background:#000}.game.expanded iframe{width:100vw;height:100vh}
    .game.expanded~.game-controls #fullscreen{position:fixed;top:14px;right:14px;z-index:1001;margin:0;background:#1d3842}
    p{color:var(--muted)}.note{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}#status{font-size:1.05rem}#diagnostics{display:none;margin-top:14px;border:1px solid #573745;border-radius:10px;padding:10px;color:var(--pink)}#diagnostics pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;color:#e2cbd1;font-size:.78rem}
    @media(max-width:600px){main{padding:22px 14px}.game{height:65vh;min-height:300px}.game-controls{justify-content:flex-start;padding:12px}.fullscreen{margin-left:auto}.control-set{gap:9px}}
  </style>
</head>
<body>
  <main>
    <header><div><div class="badge">Dux · partida compartida</div><h1>Tu imagen en el juego</h1></div><a href="/">Crear la mía</a></header>
    <section class="screen" id="preview" aria-label="Vista previa de tu diseño"><div class="wall"></div><canvas class="poster" id="poster" width="32" height="32"></canvas><div class="crosshair"></div><div class="hud"><span>DISEÑO PERSONALIZADO</span><span>DUX</span></div></section>
    <section class="game" id="game" aria-label="Juego"><iframe title="Partida Dux" id="engine" allow="fullscreen; gamepad; pointer-lock" allowfullscreen></iframe></section>
    <section class="game-controls" id="gameControls" aria-label="Controles del juego">
      <div class="control-set" aria-label="Moverse con W, A, S y D"><div class="keys" aria-hidden="true"><span class="key w">W</span><span class="key a">A</span><span class="key s">S</span><span class="key d">D</span></div><span class="control-label">Moverse</span></div>
      <div class="control-set" aria-label="Mirar con el ratón y hacer clic para disparar"><svg class="mouse-icon" viewBox="0 0 36 48" aria-hidden="true"><path d="M18 2C9.7 2 4 8.4 4 17v14c0 8.4 5.7 15 14 15s14-6.6 14-15V17C32 8.4 26.3 2 18 2Z"/><line x1="18" y1="3" x2="18" y2="19"/><line class="wheel" x1="18" y1="10" x2="18" y2="14"/></svg><span class="control-label">Mirar · disparar</span></div>
      <button class="fullscreen" id="fullscreen" type="button" aria-label="Jugar a pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span>Pantalla completa</span></button>
    </section>
    <div class="note" id="gameNote"><strong id="status">Preparando tu partida…</strong><p id="hint">Cargando el juego personalizado.</p><div id="diagnostics"><strong>No se pudo completar la carga.</strong><pre id="engineLog"></pre></div></div>
    <p id="expiry"></p>
  </main>
  <script>
    const id=location.pathname.split('/').pop(),preview=document.querySelector('#preview'),game=document.querySelector('#game'),controls=document.querySelector('#gameControls'),canvas=document.querySelector('#poster'),ctx=canvas.getContext('2d'),engine=document.querySelector('#engine'),gameNote=document.querySelector('#gameNote'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),expiry=document.querySelector('#expiry'),fullscreen=document.querySelector('#fullscreen'),diagnostics=document.querySelector('#diagnostics'),engineLog=document.querySelector('#engineLog');
    function showLoadError(message,output=''){
      status.textContent=message;status.style.color='var(--pink)';diagnostics.style.display='block';
      const useful=output.split('\n').filter(line=>/error|couldn.t|not found|failed|missing|spawn/i.test(line)).slice(-14);
      engineLog.textContent=useful.join('\n')||output.split('\n').slice(-14).join('\n')||'El motor no informó del error.';
    }
    function renderFullscreenButton(){
      const active=document.fullscreenElement===game||game.classList.contains('expanded');fullscreen.querySelector('span').textContent=active?'Salir de pantalla completa':'Pantalla completa';
      fullscreen.setAttribute('aria-label',active?'Salir de pantalla completa':'Jugar a pantalla completa');
      fullscreen.querySelector('svg').innerHTML=active?'<path d="M8 3v5H3M16 3v5h5M3 16h5v5M21 16h-5v5"/>':'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>';
    }
    function exitFallbackFullscreen(){game.classList.remove('expanded');renderFullscreenButton()}
    fullscreen.addEventListener('click',async()=>{
      if(game.classList.contains('expanded')){exitFallbackFullscreen();return}
      if(document.fullscreenElement===game){await document.exitFullscreen();renderFullscreenButton();return}
      if(typeof game.requestFullscreen!=='function'){game.classList.add('expanded');renderFullscreenButton();return}
      try{await game.requestFullscreen()}
      catch(error){game.classList.add('expanded');renderFullscreenButton()}
    });
    document.addEventListener('fullscreenchange',renderFullscreenButton);
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&game.classList.contains('expanded'))exitFallbackFullscreen()});
    Promise.all([fetch(`/v1/games/${id}`),fetch('/v1/health')]).then(async([mr,hr])=>{
      if(!mr.ok)throw new Error('Esta partida ya no está disponible.');
      const manifest=await mr.json(),health=hr.ok?await hr.json():{};expiry.textContent=`Disponible hasta el ${new Date(manifest.expiresAt*1000).toLocaleDateString('es-ES')}.`;
      if(health.engineReady&&manifest.map==='maps/start.bsp'){
        preview.hidden=true;game.style.display='block';controls.style.display='flex';status.textContent='Cargando la partida…';hint.textContent='Usa WASD para moverte, el ratón para mirar y el botón para ampliar el juego.';
        engine.addEventListener('load',()=>{
          const started=Date.now(),poll=setInterval(()=>{
            try{
              const output=engine.contentDocument.querySelector('#output')?.value||'';
              const failure=output.match(/(couldn.t open [^\n]*\.bsp|couldn.t spawn server[^\n]*|Host_Error:[^\n]*|Error:.*(?:map|model|file)[^\n]*)/i);
              if(failure){clearInterval(poll);showLoadError('No se pudo iniciar el nivel. Recarga la página para intentarlo de nuevo.',output);return;}
              if(output.includes('Server spawned.')){clearInterval(poll);gameNote.hidden=true;return;}
              if(Date.now()-started>90000){clearInterval(poll);showLoadError('El nivel está tardando demasiado en responder.',output);}
            }catch(error){if(Date.now()-started>90000){clearInterval(poll);showLoadError('No se pudo comprobar el estado del juego.');}}
          },500);
        },{once:true});
        engine.src=`/engine/index.html?+developer&1&+map&start#game=${encodeURIComponent(id)}`;return;
      }
      const tr=await fetch(`/v1/games/${id}/texture`);if(!tr.ok)throw new Error('No se pudo cargar esta partida.');
      const bytes=new Uint8Array(await tr.arrayBuffer()),image=new ImageData(new Uint8ClampedArray(bytes),manifest.width,manifest.height);canvas.width=manifest.width;canvas.height=manifest.height;ctx.putImageData(image,0,0);
      status.textContent='Tu diseño está listo para compartir.';hint.textContent=health.engineReady?'Esta partida está disponible como vista previa.':'El modo jugable no está disponible en este servidor todavía.';
    }).catch(error=>{status.textContent=error.message;status.style.color='var(--pink)';expiry.textContent='';});
  </script>
</body>
</html>
