services:
  dux:
    build: .
    ports:
      - "${DUX_BIND_PORT:-8000}:8000"
    environment:
      DUX_HOST: 0.0.0.0
      DUX_PORT: 8000
      DUX_PUBLIC_URL: ${DUX_PUBLIC_URL:-http://localhost:8000}
      DUX_DATA_DIR: /app/data/games
    volumes:
      - dux-games:/app/data/games
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dux-games:
